server:
  port: 9010
  servlet:
    context-path: '/saude-service/'

spring:
  main:
    banner-mode: off
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${saudeDBHost}:5432/${saudeDBBase}
    username: ${saudeDBUser}
    password: ${saudeDBPass}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  instance:
    hostname: ${eurekaHostname}
    non-secure-port: 9010